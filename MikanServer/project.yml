name: MikanServer
options:
  bundleIdPrefix: com.mikan
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"

packages:
  MikanProtocol:
    path: ../MikanProtocol

targets:
  MikanServer:
    type: application
    platform: macOS
    sources:
      - MikanServer
    dependencies:
      - package: MikanProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikan.MikanServer
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: MikanServer/Info.plist
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    info:
      path: MikanServer/Info.plist
      properties:
        CFBundleDisplayName: MikanServer
        LSUIElement: YES
        NSPrincipalClass: NSApplication

  MikanServerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MikanServerTests
    dependencies:
      - target: MikanServer
      - package: MikanProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikan.MikanServerTests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
