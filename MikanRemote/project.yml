name: MikanRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"

configFiles:
  Debug: ../Project.xcconfig
  Release: ../Project.xcconfig

packages:
  MikanProtocol:
    path: ../MikanProtocol

schemes:
  MikanRemote:
    build:
      targets:
        MikanRemote: all
        MikanRemoteShare: all
    run:
      config: Release
      debugEnabled: false
    test:
      config: Debug
      targets:
        - MikanRemoteTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  MikanRemote:
    type: application
    platform: iOS
    sources:
      - MikanRemote
      - Shared
    dependencies:
      - package: MikanProtocol
      - target: MikanRemoteShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).MikanRemote
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: MikanRemote/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MikanRemote.entitlements
        # The stamp-build-info script phase runs git and writes into the built
        # bundle — both blocked by Xcode's user-script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Writes the stamp AFTER every other phase: editing Info.plist instead
      # is a trap — ProcessInfoPlistFile runs after script phases and
      # overwrites it. Codesign still runs last, so the file is sealed.
      # (Same mechanism as VOB's "Stamp build info" phase.)
      - name: Stamp build info
        basedOnDependencyAnalysis: false
        script: |
          SHA=$(cd "$SRCROOT" && git rev-parse --short HEAD 2>/dev/null || echo nogit)
          (cd "$SRCROOT" && git diff --quiet HEAD 2>/dev/null) || SHA="${SHA}+"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$DEST"
          printf '{"sha":"%s","date":"%s"}\n' "$SHA" "$(date '+%Y-%m-%d %H:%M')" > "$DEST/build-info.json"

  MikanRemoteShare:
    type: app-extension
    platform: iOS
    sources:
      - MikanRemoteShare
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).MikanRemote.Share
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: MikanRemoteShare/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MikanRemoteShare.entitlements

  MikanRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MikanRemoteTests
    dependencies:
      - target: MikanRemote
      - package: MikanProtocol
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MikanRemote.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MikanRemote
