name: MikanRemoteServer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"

configFiles:
  Debug: ../Project.xcconfig
  Release: ../Project.xcconfig

packages:
  MikanProtocol:
    path: ../MikanProtocol

# Writes build-info.json (the source commit) into the app for its menu.
x-stamp-build-info: &stampBuildInfo
  name: Stamp build info
  script: 'sh "$SRCROOT/scripts/stamp-build-info.sh"'
  basedOnDependencyAnalysis: false

targets:
  MikanRemoteServer:
    type: application
    platform: macOS
    sources:
      - MikanRemoteServer
    dependencies:
      - package: MikanProtocol
    postBuildScripts:
      - *stampBuildInfo
    settings:
      base:
        PRODUCT_NAME: MikanRemoteServer
        # SemVer + a build number that only goes up (~/Scripts/ai/apps/CLAUDE.md).
        # Info.plist said 1.0 (1) through the bare v1.1.0 tag; 1.1.0 (1) is that.
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).MikanRemoteServer
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: MikanRemoteServer/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    info:
      path: MikanRemoteServer/Info.plist
      properties:
        CFBundleDisplayName: MikanRemoteServer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: YES
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: "MikanRemoteServer needs local network access to accept connections from MikanRemote."
        NSBonjourServices:
          - _mikan._tcp

  MikanRemoteServerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MikanRemoteServerTests
    dependencies:
      - target: MikanRemoteServer
      - package: MikanProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).MikanRemoteServerTests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
