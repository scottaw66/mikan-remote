name: MikanRemoteServer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"

configFiles:
  Debug: ../Project.xcconfig
  Release: ../Project.xcconfig

packages:
  MikanProtocol:
    path: ../MikanProtocol

targets:
  MikanRemoteServer:
    type: application
    platform: macOS
    sources:
      - MikanRemoteServer
    dependencies:
      - package: MikanProtocol
    settings:
      base:
        PRODUCT_NAME: MikanRemoteServer
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).MikanRemoteServer
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: MikanRemoteServer/Info.plist
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    info:
      path: MikanRemoteServer/Info.plist
      properties:
        CFBundleDisplayName: MikanRemoteServer
        LSUIElement: YES
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: "MikanRemoteServer needs local network access to accept connections from MikanRemote."
        NSBonjourServices:
          - _mikan._tcp

  MikanRemoteServerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MikanRemoteServerTests
    dependencies:
      - target: MikanRemoteServer
      - package: MikanProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).MikanRemoteServerTests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
